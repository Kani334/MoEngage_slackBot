services:
  - type: web
    name: ticket-assistant
    runtime: node
    rootDir: ticket-assistant
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SLACK_USER_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: MY_SLACK_USER_ID
        sync: false
      - key: FRESHDESK_DOMAIN
        sync: false
      - key: FRESHDESK_API_KEY
        sync: false
      - key: FRESHDESK_FEEDBACK_SCHEMA_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
